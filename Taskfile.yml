version: "3"

includes:
  frontend:
    taskfile: ./Taskfile.Frontend.yml
    dir: .
  dotnet:
    taskfile: ./Taskfile.Dotnet.yml
    dir: .

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list-all

  dev:
    desc: Start the frontend dev server (alias for frontend:dev)
    cmds:
      - task: frontend:dev
