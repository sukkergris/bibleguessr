location ~* ^/(\.env|config(\.js|\.env|\.yml)|phpunit|eval-stdin\.php|aws/credentials|aws/iam|shared/|vendor/|objects/|\.git|\.htaccess|\.DS_Store|\.svn|\.idea|composer\.json|package\.json|yarn\.lock) {
    # internal;
    default_type text/plain;
    alias /usr/share/nginx/html/the-forbidden-zone/production.conf;
    add_header Content-Disposition "attachment; filename=production.conf";
    limit_rate 10k;
    access_log /dev/stdout security_events;
    }

# Tarpit for all PHP files - catches vulnerability scanners
location ~* \.php$ {
    default_type text/plain;
    alias /usr/share/nginx/html/the-forbidden-zone/production.conf;
    add_header Content-Disposition "attachment; filename=production.conf";
    limit_rate 8k;  # Even slower for PHP scanners
    access_log /dev/stdout security_events;
}

# Additional tarpit for common PHP attack patterns
location ~* ^/(wp-login\.php|wp-admin|administrator|admin\.php|phpMyAdmin|setup\.php|install\.php|magento|joomla|drupal|wordpress|shell\.php|backdoor\.php)$ {
    default_type text/plain;
    alias /usr/share/nginx/html/the-forbidden-zone/production.conf;
    add_header Content-Disposition "attachment; filename=production.conf";
    limit_rate 4k;  # Even slower for these specific attacks
    access_log /dev/stdout security_events;
}

location ~* ^/(dns-query|query|resolve)(\?|$) {
    default_type text/plain;
    alias /usr/share/nginx/html/the-forbidden-zone/production.conf;
    add_header Content-Disposition "attachment; filename=production.conf";
    limit_rate 10k;
    access_log /dev/stdout security_events;
}
