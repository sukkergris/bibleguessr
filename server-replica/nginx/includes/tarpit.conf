# Tarpit locations for vulnerability scanners.
#
# Paths only a scanner would request are answered with an endlessly generated
# fake configuration file (njs/tarpit.js), streamed slowly so the scanner's
# connection is held open instead of being freed up for the next target.
#
# The body is generated, not read from disk: there is no decoy file to mount or
# commit. Pacing is the $tarpit_rate variable below (bytes/second) --
# `limit_rate` does not apply to output from js_content.

# Dotfiles, secrets and dependency directories.
location ~* ^/(\.env|config(\.js|\.env|\.yml)|phpunit|eval-stdin\.php|aws/credentials|aws/iam|shared/|vendor/|objects/|\.git|\.htaccess|\.DS_Store|\.svn|\.idea|composer\.json|package\.json|yarn\.lock) {
    access_log /dev/stdout security_events;
    set $tarpit_rate 10240;
    js_content tarpit.run;
}

# Known CMS admin paths -- slowest, these are the most persistent scanners.
# MUST stay above the generic \.php$ block: nginx uses the FIRST matching
# regex location, so a broader .php rule placed first would shadow these.
location ~* ^/(wp-login\.php|wp-admin|administrator|admin\.php|phpMyAdmin|setup\.php|install\.php|magento|joomla|drupal|wordpress|shell\.php|backdoor\.php)$ {
    access_log /dev/stdout security_events;
    set $tarpit_rate 4096;
    js_content tarpit.run;
}

# Any PHP URL. Nothing here serves PHP, so every hit is a scanner.
location ~* \.php$ {
    access_log /dev/stdout security_events;
    set $tarpit_rate 8192;
    js_content tarpit.run;
}

# DNS-over-HTTP probes looking for an open resolver.
location ~* ^/(dns-query|query|resolve)(\?|$) {
    access_log /dev/stdout security_events;
    set $tarpit_rate 10240;
    js_content tarpit.run;
}
