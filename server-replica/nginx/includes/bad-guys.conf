# Blocks scanners/abusive IPs. Used as $bad_guys in conf.d/10-bibleguessr.conf.
# The address list lives in bad-ip-entries.conf so it can be shared with other
# geo blocks (see geo-bad-ips.conf) instead of being maintained twice.
geo $bad_guys {
    default 0;
    include /etc/nginx/includes/bad-ip-entries.conf;
}
