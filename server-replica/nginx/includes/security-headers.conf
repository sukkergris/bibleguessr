# Sensitive-path blocking.
#
# Same intent as tarpit.conf but without the slow drip: these are answered from
# the generated body too, so there is no decoy file on disk. access_log is off
# here so routine scanner noise does not fill the main log -- tarpit.conf logs
# its own hits under the security_events format.
#
# NOTE: despite the filename, this file sets no HTTP security headers
# (HSTS/CSP/X-Content-Type-Options). See docs/web/cyber-security/index.html.

location ~* ^/(dns-query|query|resolve)(\?|$) {
    access_log off;
    set $tarpit_rate 10240;
    js_content tarpit.run;
}

location ~* ^/(\.env|config(\.js|\.env|\.yml)|phpunit|eval-stdin\.php|aws/credentials|aws/iam|shared/|vendor/|objects/|\.git|\.htaccess|\.DS_Store|\.svn|\.idea|composer\.json|package\.json|yarn\.lock|node_modules) {
    access_log off;
    set $tarpit_rate 10240;
    js_content tarpit.run;
}
