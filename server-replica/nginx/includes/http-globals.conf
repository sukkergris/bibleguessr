# Global (http-level) definitions used by server blocks and locations.
#
# This file is included from conf.d/00-globals.conf rather than from nginx.conf,
# because conf.d/*.conf is loaded on two different paths:
#   1. our nginx.conf, when OpenResty is started with -c /etc/nginx/nginx.conf
#   2. the OpenResty image's own default config, which does
#      `include /etc/nginx/conf.d/*.conf` and nothing else of ours
# Hanging these definitions off the first file in the conf.d glob keeps
# $bad_guys, $squidex_upstream, the api_limit zone and the log formats
# resolvable in both cases, instead of only the first.
resolver 127.0.0.11 valid=10s ipv6=off;

# Lua modules (lua/tarpit.lua). The trailing ;; keeps OpenResty's built-in
# search path, which the bundled resty.* libraries are found on.
lua_package_path "/etc/nginx/lua/?.lua;;";

include /etc/nginx/includes/log-formats.conf;
include /etc/nginx/includes/upstreams.conf;
include /etc/nginx/includes/good-guys.conf;
include /etc/nginx/includes/bad-guys.conf;
include /etc/nginx/includes/geo-bad-ips.conf;
include /etc/nginx/includes/rate-limiting.conf;
include /etc/nginx/includes/prerender-maps.conf;
