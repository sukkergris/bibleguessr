# Shared upstream targets, defined once via `map` (the http-level equivalent of
# `set`, which only works in server/location/if context) so every server block
# proxies through the same variable instead of repeating the literal URL.
#
# Using a variable (not a literal host) in proxy_pass makes nginx defer DNS
# lookup to request time via the resolver in http-globals.conf, instead of
# caching the IP once at config load and failing/going stale if "squidex"
# isn't resolvable yet or gets recreated with a new IP.
map "" $squidex_upstream {
    default "http://squidex:5000";
}
