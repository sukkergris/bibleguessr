# Priority prefix match for images (^~ prevents regex locations from taking precedence)
location ^~/img/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public";
}

# Video files caching and serving
location ~* \.(mp4|webm|ogg|mov)$ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    expires 234d;
    add_header Cache-Control "public, max-age=20217600";
    add_header Content-Type "video/mp4";
    access_log off;
}

# Configuration files
location ^~/config/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    expires 47m;
    add_header Cache-Control "public";
}

# Static text files
location = /robots.txt {
    root /usr/share/nginx/html;
    try_files /robots.txt =404;
}

location = /humans.txt {
    root /usr/share/nginx/html;
    try_files /humans.txt =404;
}

location = /BingSiteAuth.xml {
    root /usr/share/nginx/html;
    try_files /BingSiteAuth.xml =404;
}