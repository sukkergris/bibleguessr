# The njs module is a dynamic module in the stock nginx image (OpenResty had
# Lua built in), so it must be loaded before any js_* directive is parsed.
# load_module only works in the main context, above events/http.
#
# Absolute path on purpose. A relative path resolves against nginx's prefix
# (/etc/nginx), which works only because the image ships /etc/nginx/modules as
# a symlink to the real directory -- and the devcontainer bind-mounts this repo
# over /etc/nginx, replacing that symlink. --modules-path is the real location
# and is unaffected by the mount.
load_module /usr/lib/nginx/modules/ngx_http_js_module.so;

worker_processes 1;
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Modular configuration files. conf.d/00-globals.conf sorts first and pulls
    # in includes/http-globals.conf, so the global definitions are loaded here
    # too -- including it again at this level would redefine them and fail.
    include /etc/nginx/conf.d/*.conf;
}
