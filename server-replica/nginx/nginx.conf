worker_processes 1;
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Modular configuration files. conf.d/00-globals.conf sorts first and pulls
    # in includes/http-globals.conf, so the global definitions are loaded here
    # too -- including it again at this level would redefine them and fail.
    include /etc/nginx/conf.d/*.conf;
}
