# Runs the probe script and returns its output as plain text.
#
# lua_code_cache is off so the runner can swap current-probe.lua between
# tests: with the cache on, content_by_lua_file compiles once and every
# later test would silently re-run the first probe.
events { worker_connections 64; }
http {
    lua_package_path "/etc/nginx/lua/?.lua;/etc/nginx/test/?.lua;;";
    lua_code_cache off;
    server {
        listen 8096;
        location /run {
            default_type text/plain;
            content_by_lua_file /etc/nginx/test/current-probe.lua;
        }
    }
}
