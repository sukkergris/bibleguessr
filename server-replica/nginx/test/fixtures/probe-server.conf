# Runs the probe script and returns its output as plain text.
#
# The probe module is swapped between tests by overwriting
# njs/current-probe.js. njs compiles js_import modules at config load, so the
# runner reloads nginx after each swap rather than relying on a code cache
# toggle (njs has no lua_code_cache equivalent).
load_module /usr/lib/nginx/modules/ngx_http_js_module.so;

# Own pid file: the tarpit server runs alongside this one, and `nginx -s stop`
# addresses whichever instance owns the pid file it is pointed at.
pid /var/run/nginx-probe.pid;

events { worker_connections 64; }
http {
    js_path "/etc/nginx/njs/";
    js_import probe from current-probe.js;

    server {
        listen 8096;
        location /run {
            default_type text/plain;
            js_content probe.run;
        }
    }
}
