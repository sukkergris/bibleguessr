# Test server: the real tarpit locations, plus named endpoints at known rates
# so a test can assert on one rate without depending on path routing.
events { worker_connections 64; }
http {
    lua_package_path "/etc/nginx/lua/?.lua;/etc/nginx/test/?.lua;;";

    include /etc/nginx/includes/log-formats.conf;

    server {
        listen 8095;

        # The real location rules, exactly as production loads them.
        include /etc/nginx/includes/tarpit.conf;

        # Fixed-rate endpoints for rate assertions.
        location = /_rate/slow { content_by_lua_block { require("tarpit").run({ rate = 4096 })  } }
        location = /_rate/fast { content_by_lua_block { require("tarpit").run({ rate = 10240 }) } }

        # A short-lived one, to assert max_seconds terminates the response.
        location = /_capped    { content_by_lua_block { require("tarpit").run({ rate = 10240, max_seconds = 2 }) } }

        # Anything else is a normal response.
        location / { return 200 "normal\n"; }
    }
}
