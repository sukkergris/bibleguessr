# Test server: the real tarpit locations, plus named endpoints at known rates
# so a test can assert on one rate without depending on path routing.
load_module /usr/lib/nginx/modules/ngx_http_js_module.so;

# Own pid file, so stopping the probe server does not signal this one.
pid /var/run/nginx-tarpit.pid;

events { worker_connections 64; }
http {
    js_path "/etc/nginx/njs/";
    js_import tarpit from tarpit.js;

    js_var $tarpit_rate;
    # Test-wide cap: the production rules included below are deliberately
    # uncapped (max_seconds defaults to 900), which no probe could ever read to
    # completion. Overriding the default here keeps includes/tarpit.conf under
    # test as-written while still letting every request finish.
    js_var $tarpit_max_seconds 2;
    js_var $tarpit_filename;

    include /etc/nginx/includes/log-formats.conf;

    server {
        listen 8095;

        # The real location rules, exactly as production loads them.
        include /etc/nginx/includes/tarpit.conf;

        # Fixed-rate endpoints for rate assertions. Capped, because njs reads
        # the body to completion (no cosocket to stop reading mid-stream), so
        # an uncapped endpoint would never let the probe finish. The cap is
        # long enough that the measured rate is still meaningful.
        location = /_rate/slow {
            set $tarpit_rate 4096;
            set $tarpit_max_seconds 4;
            js_content tarpit.run;
        }
        location = /_rate/fast {
            set $tarpit_rate 10240;
            set $tarpit_max_seconds 4;
            js_content tarpit.run;
        }

        # A short-lived one, to assert max_seconds terminates the response.
        location = /_capped {
            set $tarpit_rate 10240;
            set $tarpit_max_seconds 2;
            js_content tarpit.run;
        }

        # Anything else is a normal response.
        location / { return 200 "normal\n"; }
    }
}
