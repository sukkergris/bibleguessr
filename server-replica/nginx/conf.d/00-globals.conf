# Global http-level definitions (log formats, upstreams, geo/map variables,
# rate-limit zones) are pulled in here, from the first file in the conf.d glob,
# so they are defined whether conf.d/ is loaded via our nginx.conf or via the
# nginx image's own default config. See includes/http-globals.conf.
include /etc/nginx/includes/http-globals.conf;

# Handling header-less scans
# Catch-all: HTTP
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;
    include /etc/nginx/includes/security-checks.conf;
    return      444;
}
# Catch-all: drop ukendte forbindelser på 443 (porscannere, SNI-sniffing)
server {
    listen      443 ssl default_server;
    listen      [::]:443 ssl default_server;
    server_name _;

    include /etc/nginx/includes/security-checks.conf;

    ssl_certificate     /etc/nginx/ssl/dummy.crt;
    ssl_certificate_key /etc/nginx/ssl/dummy.key;

    return      444;
}
