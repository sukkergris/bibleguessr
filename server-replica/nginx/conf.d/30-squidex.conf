# HTTP redirect
server {
    listen 80;
    server_name squidex.bibleguessr.local www.squidex.bibleguessr.local;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt_challenges;
        try_files $uri =404;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Squidex
server {
    listen 443 ssl;
    server_name squidex.bibleguessr.local www.squidex.bibleguessr.local;

    ssl_certificate /etc/letsencrypt/live/bibleguessr.local/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bibleguessr.local/privkey.pem;
    include /etc/nginx/includes/ssl-params.conf;

    client_max_body_size 200M;

    location / {
        # $squidex_upstream is defined once in includes/upstreams.conf.
        proxy_pass $squidex_upstream;
        proxy_http_version 1.1;
        include /etc/nginx/includes/proxy-params.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
