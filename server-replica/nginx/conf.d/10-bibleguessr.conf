# HTTP redirect
server {
    listen 80;
    access_log /dev/stdout realip;
    server_name bibleguessr.single www.bibleguessr.single;

    if ($bad_guys = 1) {
        return 302 $scheme://$host$request_uri;
    }

    include /etc/nginx/includes/tarpit.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt_challenges;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS main site
server {
    listen 443 ssl;
    http2 on;
    access_log /dev/stdout realip;
    server_name bibleguessr.single www.bibleguessr.single;

    if ($bad_guys = 1) {
        return 302 $scheme://$host$request_uri;
    }

    include /etc/nginx/includes/tarpit.conf;

    ssl_certificate /etc/letsencrypt/live/bibleguessr.single/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bibleguessr.single/privkey.pem;
    include /etc/nginx/includes/ssl-params.conf;

    location /cms/ {
        # Trailing slash strips the /cms/ prefix so Squidex receives /api/... paths.
        # $squidex_upstream is defined once in includes/upstreams.conf.
        proxy_pass $squidex_upstream/;
        proxy_http_version 1.1;
        include /etc/nginx/includes/proxy-params.conf;
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;
        proxy_pass $web_api_upstream;
        rewrite ^/api/(.*)$ /$1 break;
        add_header Cache-Control 'no-cache';
        expires 0;
        include /etc/nginx/includes/proxy-params.conf;
    }

    location = /sitemap.xml {
        proxy_pass $web_api_upstream;
        add_header Cache-Control 'no-cache';
        expires 0;
        include /etc/nginx/includes/proxy-params.conf;
    }

    include /etc/nginx/includes/static-assets.conf;

    set $nginx_env_name "${NGINX_ENV_NAME}";
    set $nginx_gtag_id "GTM-NK3XW48N";
    set $nginx_pixel_id "1470367793989555";
    set $web_api_upstream "http://dev:5130";
    set $yarp_upstream "http://host.docker.internal:5140";
    set $frontend_upstream "http://dev:3033";

    location / {
        proxy_pass $frontend_upstream;
        include /etc/nginx/includes/proxy-websocket.conf;
        sub_filter '</head>' '<meta name="environment-name" content="local" /></head>';
        sub_filter_once on;
    }

    location /prerender-static/ {
        internal;
        alias /var/prerender/;
        try_files $uri/index.html $uri.html @prerender_miss;
        add_header X-Prerender-Served "static" always;
        expires 1h;
    }

    location @prerender_miss {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        add_header Cache-Control 'no-cache, must-revalidate';

        sub_filter_once off;
        sub_filter '__ENVIRONMENT_NAME__'      "$nginx_env_name";
        sub_filter '__GOOGLE_TAG_MANAGER_ID__' "$nginx_gtag_id";
        sub_filter '__PIXEL_ID__'              "$nginx_pixel_id";

        expires 0;
    }
}
