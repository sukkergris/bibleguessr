name: Release app

on:
  push:
    tags:
      - 'frontend-v*'
  workflow_dispatch:

jobs:

  backend-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: arduino/setup-task@v2
        with:
          version: '3.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task dotnet:test

  frontend-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: arduino/setup-task@v2
        with:
          version: '3.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task frontend:test
      - run: task frontend:build

  docker-publish:
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-task@v2
        with:
          version: '3.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESSTOKEN_RW }}
      - run: task docker:build:app
      - run: task docker:publish:app

  bundle:
    needs: [docker-publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: arduino/setup-task@v2
        with:
          version: '3.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: task release:bundle

      - uses: actions/upload-artifact@v4
        if: env.BIBLEGUESSR_LOCAL_ACT != 'true'
        with:
          name: frontend-zip
          path: artifacts/*.zip

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "${{ github.ref_name }}" artifacts/*.zip --draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
