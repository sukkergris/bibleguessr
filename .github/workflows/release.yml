name: Release app

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

env:
  # Platforms every Docker image is built for. Keep in sync with ci.yml.
  IMAGE_PLATFORMS: linux/amd64,linux/arm64

jobs:

  check-tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches release version
        if: startsWith(github.ref, 'refs/tags/')
        run: scripts/ci/check-release-tag.sh "${{ github.ref_name }}"

  ci:
    needs: [check-tag]
    # https://github.com/github/vscode-github-actions/issues/254
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # Builds and pushes each image as one multi-platform manifest list covering
  # every platform in IMAGE_PLATFORMS, under the same name and tag as before.
  docker-publish:
    needs: [ci]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [api, nginx]
    env:
      DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
      BUILD_SHA: ${{ github.sha }}
      BUILD_CONTEXT: ${{ vars.BUILD_CONTEXT }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "tag=$(scripts/ci/load-image-version.sh)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESSTOKEN_RW }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile.${{ matrix.image }}
          platforms: ${{ env.IMAGE_PLATFORMS }}
          build-args: |
            BUILD_SHA=${{ env.BUILD_SHA }}
            BUILD_CONTEXT=${{ env.BUILD_CONTEXT }}
          tags: ${{ env.DOCKER_USERNAME }}/bibleguessr-${{ matrix.image }}:${{ steps.version.outputs.tag }}
          push: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }},ignore-error=true

  bundle:
    needs: [ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: arduino/setup-task@v2
        with:
          version: '3.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: task release:bundle

      - uses: actions/upload-artifact@v4
        if: env.BIBLEGUESSR_LOCAL_ACT != 'true'
        with:
          name: frontend-zip
          path: artifacts/*.zip

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "${{ github.ref_name }}" artifacts/*.zip --draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
