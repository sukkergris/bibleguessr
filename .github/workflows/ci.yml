name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

env:
  # Platforms every Docker image is built for. Keep in sync with release.yml.
  IMAGE_PLATFORMS: linux/amd64,linux/arm64

jobs:
  backend-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: arduino/setup-task@v2
        with:
          version: '3.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task dotnet:test

  frontend-build:
    runs-on: ubuntu-24.04
    env:
      BUILD_SHA: ${{ github.sha }}
      BUILD_CONTEXT: ${{ vars.BUILD_CONTEXT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: arduino/setup-task@v2
        with:
          version: '3.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task frontend:test
      - run: task frontend:build

  # Builds both images for every platform in IMAGE_PLATFORMS without pushing,
  # so a change that breaks one architecture fails CI rather than the release.
  # The GitHub Actions cache is shared with release.yml's docker-publish job.
  docker-build:
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [api, nginx]
    env:
      DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
      BUILD_SHA: ${{ github.sha }}
      BUILD_CONTEXT: ${{ vars.BUILD_CONTEXT }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "tag=$(scripts/ci/load-image-version.sh)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile.${{ matrix.image }}
          platforms: ${{ env.IMAGE_PLATFORMS }}
          build-args: |
            BUILD_SHA=${{ env.BUILD_SHA }}
            BUILD_CONTEXT=${{ env.BUILD_CONTEXT }}
          tags: ${{ env.DOCKER_USERNAME }}/bibleguessr-${{ matrix.image }}:${{ steps.version.outputs.tag }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }},ignore-error=true
