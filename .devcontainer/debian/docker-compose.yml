name: bibleguessr-development

services:
  dev:
    # Instructions on how to build the image for this service
    build:
      # Use the current directory (.devcontainer) as the build context
      context: .
      # Specify the Dockerfile within the build context
      dockerfile: Dockerfile.debian

    # Define volumes to mount
    volumes:
      # Mount the entire project directory (one level up from .devcontainer)
      # into the /workspace directory inside the container.
      # 'cached' optimizes mount performance on macOS/Windows.
      - ../..:/xyz:cached
      - bibleguessr-elm-devcontainer:/home/container-user/.elm
      - bibleguessr-claude:/home/container-user/.claude
      - bibleguessr-continue:/home/container-user/.continue
      # A direct child of $HOME, deliberately not ~/.config/gh: mounting a
      # volume under ~/.config would force Docker to create that missing
      # parent directory as root (it doesn't exist in the image), which then
      # blocks the dotfiles repo's stow packages from writing their own
      # subdirectories into ~/.config.
      - bibleguessr-gh:/home/container-user/.gh
      # - /var/run/docker.sock:/var/run/docker.sock
      # macOS Docker Desktop: forwards SSH agent via host-services socket.
      # Linux alternative: ${SSH_AUTH_SOCK}:/ssh-agent
      - /run/host-services/ssh-auth.sock:/ssh-agent
    environment:
      SSH_AUTH_SOCK: /ssh-agent
      # Redirects gh's config/credentials away from the default ~/.config/gh
      # to match the volume mount above.
      GH_CONFIG_DIR: /home/container-user/.gh
    # Command to run when the container starts.
    # 'sleep infinity' keeps the container running indefinitely so VS Code can attach.
    command: sleep infinity

    networks:
      - internal
  nginx:
    image: openresty/openresty:alpine
    # pull_policy: missing
    # container_name: site-fleet-cms-nginx
    ports:
      - '80:80'
      - '443:443'
    networks:
      internal:
        aliases:
          - bibleguessr.single
          - www.bibleguessr.single

    volumes:
      - ../../server-replica/nginx:/etc/nginx:ro
      # - ../../frontend/habibi-vip-taxi/public/the-forbidden-zone/:/usr/share/nginx/html/the-forbidden-zone:ro
      - ../../server-replica/letsencrypt_challenges/:/var/www/letsencrypt_challenges
      - ../../server-replica/letsencrypt/:/etc/letsencrypt:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      dev:
        condition: service_started
      mailpit:
        condition: service_started
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      # 8073: Web-Ui for viewing mails
      - 8073:8025
      # 1025: SMTP-port (Where your app are sending mails to)
      - 1025:1025
    volumes:
      - bibleguessr-mailpit-data:/data
    networks:
      - internal

volumes:
  bibleguessr-elm-devcontainer:
  bibleguessr-claude:
  bibleguessr-continue:
  bibleguessr-gh:
  bibleguessr-mailpit-data:

networks:
  internal:
    driver: bridge
