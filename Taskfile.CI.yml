version: '3'

tasks:
  lint:
    desc: Lint the GitHub Actions workflow files
    cmds:
      - actionlint

  act:
    desc: Run the CI workflow locally in containers
    cmds:
      - ./scripts/ci/run-ci-workflow.sh {{.CLI_ARGS}}

  act-ci:
    desc: Run the CI workflow locally with act
    env:
      IMAGE_TAG: '{{.IMAGE_TAG}}'
    cmds:
      - 'echo "IMAGE_TAG: ${IMAGE_TAG}"'
      - ./scripts/ci/run-ci-workflow.sh --env-file .env --env IMAGE_TAG="${IMAGE_TAG}"

  act-main:
    desc: Run the application release workflow locally with act
    env:
      IMAGE_TAG: '{{.IMAGE_TAG}}'
    cmds:
      - 'echo "IMAGE_TAG: ${IMAGE_TAG}"'
      - ./scripts/ci/run-main-workflow.sh --env-file .env --secret-file .secrets --env IMAGE_TAG="${IMAGE_TAG}"

