version: "3"

vars:
  FSX_DIR: build/fsx

tasks:
  frontend:
    desc: Build the production frontend and verify the release artifact
    deps:
      - :frontend:test
      - :frontend:build
    cmds:
      - dotnet fsi {{.FSX_DIR}}/VerifyFrontendArtifact.fsx

  revision:
    desc: "Increment the frontend and/or backend revision by one (task release:revision -- frontend backend)"
    cmds:
      - dotnet fsi {{.FSX_DIR}}/IncrementRevision.fsx {{.CLI_ARGS}}

  bundle:
    desc: Package the verified frontend build as a release zip
    deps:
      - frontend
    cmds:
      - dotnet fsi {{.FSX_DIR}}/BundleFrontend.fsx
