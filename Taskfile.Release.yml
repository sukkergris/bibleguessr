version: "3"

vars:
  FSX_DIR: build/fsx

tasks:
  frontend:
    desc: Build the production frontend and verify the release artifact
    deps:
      - :frontend:test
      - :frontend:build
    cmds:
      - dotnet fsi {{.FSX_DIR}}/VerifyFrontendArtifact.fsx

  bundle:
    desc: Package the verified frontend build as a release tarball
    deps:
      - frontend
    cmds:
      - dotnet fsi {{.FSX_DIR}}/BundleFrontend.fsx

  tag:
    desc: Tag the current commit with the frontend version
    cmds:
      - dotnet fsi {{.FSX_DIR}}/AddGitTag.fsx

  publish:
    desc: Create a draft GitHub release and upload the tarball
    deps:
      - bundle
    cmds:
      - dotnet fsi {{.FSX_DIR}}/PublishGitHubRelease.fsx
