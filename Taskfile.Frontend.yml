version: "3"

vars:
  FRONTEND_DIR: frontend

tasks:
  install:
    desc: Install frontend dependencies
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm install
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules/.package-lock.json

  dev:
    desc: Start the Vite dev server (http://localhost:5173)
    dir: "{{.FRONTEND_DIR}}"
    deps:
      - install
    cmds:
      - npm run dev

  build:
    desc: Type-check and build the frontend for production
    dir: "{{.FRONTEND_DIR}}"
    deps:
      - install
    cmds:
      - npm run build

  preview:
    desc: Preview the production build locally
    dir: "{{.FRONTEND_DIR}}"
    deps:
      - build
    cmds:
      - npm run preview
